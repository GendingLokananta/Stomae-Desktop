name: Build Stomake PC EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Verify PySide6 graphics imports
        run: python -c "from PySide6.QtWidgets import QGraphicsView, QGraphicsScene, QGraphicsRectItem; from PySide6.QtGui import QPainter, QPixmap; print('PySide6 graphics imports OK')"
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Stomake --collect-all PySide6 --collect-all shiboken6 main.py
      - name: Package portable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/Stomake.exe release/Stomake.exe
          Copy-Item README.md release/README.txt
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Stomake-PC-Windows
          path: release/
          retention-days: 30

name: Build Stomake 2.2 Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stomake-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Maven 3.9
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: '3.9.9'

      - name: Verify required Java sources are tracked
        shell: pwsh
        run: |
          $required = @(
            'src/main/java/id/stomake/data/Database.java',
            'src/main/java/id/stomake/data/Repository.java',
            'src/main/java/id/stomake/ui/WindowChrome.java'
          )
          foreach ($file in $required) {
            git ls-files --error-unmatch $file | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Required Java source is not committed: $file. Check .gitignore and commit the complete source tree."
            }
          }

      - name: Build portable Windows application
        shell: pwsh
        run: ./Build-Windows.ps1

      - name: Verify Windows launcher
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Stomake/Stomake.exe')) {
            throw 'Stomake.exe was not generated.'
          }
          Get-Item 'dist/Stomake/Stomake.exe' | Format-List FullName,Length,LastWriteTime

      - name: Create distributable ZIP and checksum
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = "dist/Stomake-$version-Windows-x64.zip"
          Compress-Archive -Path 'dist/Stomake' -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $(Split-Path $zip -Leaf)" | Set-Content 'dist/SHA256SUMS.txt'
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: Stomake-2.2-Windows-x64
          path: |
            dist/Stomake-*-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
